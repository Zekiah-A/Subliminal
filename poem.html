<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Subliminal</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.ico">
	<link rel="stylesheet" href="./styles.css">
	<meta name="description" content="">
	<meta name="keywords" content="">
	<!-- Components -->
	<script type="module" src="src/components/content-warning-template.js"></script>
	<script type="module" src="src/components/poem-ghost-template.js"></script>
	<script type="module" src="src/components/load-cover-template.js"></script>
	<!-- Services -->
	<script type="module" src="src/pages/poem-editor/editor-document.js"></script>
	<!-- Entrypoint -->
	<script type="module" src="src/pages/poem/poem.js"></script>
</head>
<body>
	<div class="title-blur">
		<h2 class="title-header content" id="poemTitle">Poem - By Author</h2>
		<hr>
	</div>
	<div id="poemMain" class="poem-centre">
		<p id="poemContent">
			<subliminal-poem-ghost length="30"></subliminal-poem-ghost>
			<subliminal-load-cover></subliminal-load-cover>
		</p>
	</div>
	<dialog id="editFrame" style="width: max(30%, 360px);" class="popup flex-popup">
		<h2>Edit poem:</h2>
		<div style="display: flex; column-gap: 8px;">
			<button type="button" class="popup-button" style="height: 128px; opacity: 0.6;pointer-events: none;">
				<div style="display: flex; flex-direction: column; align-items: center;">
					<img src="./assets/AmendMode.png" style="display: block;" height="112" width="112">Amend original poem
				</div>
			</button>
			<button type="button" class="popup-button" style="height: 128px;" onclick="window.location.href = window.location.origin + '/poem-editor?edit=' + window.location.pathname + '.json' + '&version=2';">
				<div style="display: flex; flex-direction: column; align-items: center;">
					<img src="./assets/InspiredMode.png" style="display: block;" height="112" width="112">New Inspired poem
				</div>
			</button>
		</div>
		<br>
		<button type="button" class="popup-button" onclick="editFrame.close();">Cancel</button>
	</dialog>
	<a id="back" href="javascript: window.location.href = window.location.origin + '/poems';" class="back"> &lt;- Back</a>
	<div onclick="editFrame.showModal();" class="edit">
		<svg xmlns="http://www.w3.org/2000/svg" style="fill: var(--text-colour);" height="32" width="32" viewBox="0 0 48 48"><path d="M9 39h2.2l22.15-22.15-2.2-2.2L9 36.8Zm30.7-24.3-6.4-6.4 2.1-2.1q.85-.85 2.1-.85t2.1.85l2.2 2.2q.85.85.85 2.1t-.85 2.1Zm-2.1 2.1L12.4 42H6v-6.4l25.2-25.2Zm-5.35-1.05-1.1-1.1 2.2 2.2Z"></path></svg>
	</div>
</body>
</html>
